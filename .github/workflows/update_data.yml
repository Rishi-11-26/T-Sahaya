name: Automated Govt Data Sync

on:
  # Run every day at 00:00 UTC
  schedule:
    - cron: "0 0 * * *"
  # Also allow manual trigger from the GitHub UI
  workflow_dispatch:

jobs:
  sync-data:
    name: Scrape Telangana Portal & Update Eligibility Rules
    runs-on: ubuntu-latest

    permissions:
      contents: write   # needed to push the commit back

    steps:
      # 1. Checkout the repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Install scraper dependencies
      - name: Install dependencies
        run: pip install requests beautifulsoup4

      # 4. Run the scout agent (scrapes portal news AND scheme eligibility pages)
      - name: Run scout_agent.py
        run: python scout_agent.py

      # 5. Check if any tracked files changed
      - name: Check for changes
        id: check_changes
        run: |
          git diff --quiet public/data.json schemes_eligibility.json || echo "changed=true" >> $GITHUB_OUTPUT

      # 6. Commit & push both files if anything changed
      - name: Commit updated files
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data.json schemes_eligibility.json
          git commit -m "Automated Govt Data Sync [Skip CI]"
          git push

